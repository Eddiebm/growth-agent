services:
  - type: web
    name: growth-agent-crm
    runtime: node
    plan: free
    region: oregon
    rootDir: .
    buildCommand: npm install
    startCommand: npx tsx apps/api/src/server.ts
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MOCK_INTEGRATIONS
        sync: false
      - key: HERO_PRODUCT_SLUG
        value: hvac-receptionist-agent
      - key: HERO_MODE
        value: "true"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: CRON_ENABLED
        value: "true"
      - key: KEEP_ALIVE
        value: "true"
      - key: KEEP_ALIVE_MS
        value: "240000"
      - key: NODE_ENV
        value: production
      - key: DEFAULT_CAMPAIGN_ID
        value: "11111111-1111-1111-1111-111111111111"
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_SALES_ASSISTANT_ID
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: VAPI_WEBHOOK_SECRET
        sync: false
      - key: VAPI_COST_PER_MIN_CENTS
        value: "15"
      - key: CALCOM_BOOKING_URL
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_TELEGRAM_ID
        sync: false
